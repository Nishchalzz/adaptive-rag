[project]
name = "adaptive-rag-backend"
version = "0.1.0"
description = "Query-adaptive retrieval and evidence verification for reliable RAG (research prototype)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls the real OpenAI API; requires OPENAI_API_KEY (run with -m live)",
]
addopts = "-m 'not live'"
