server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri /index.html;
    }

    # API (including server-sent events for /api/query/stream)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;          # stream SSE events as they are produced
        proxy_cache off;
        proxy_read_timeout 600s;      # verification retries can take over a minute
        proxy_send_timeout 600s;
        client_max_body_size 30m;     # document uploads
    }
}
